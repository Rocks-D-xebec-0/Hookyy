name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  node14-smoke:
    # The dev toolchain needs Node 18+, so build there and run the built package on Node 14 (the engines minimum).
    name: Built package on Node 14
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci && npm run build
      - uses: actions/setup-node@v4
        with:
          node-version: 14
      - run: node dist/cli.js --version
      - run: node dist/cli.js analyze tests/fixtures/real/cucumberjs12-tallyb.ndjson --no-color
      - run: node dist/cli.js analyze "tests/fixtures/real/*.ndjson" -f json > /dev/null
      - name: Reporter and API load on Node 14
        run: |
          node -e "const R = require('./dist/playwright-reporter.js'); new R(); require('./dist/index.js').analyze({ reportPath: 'tests/fixtures/playwright-hookyy.json', config: {} }); console.log('ok')"
